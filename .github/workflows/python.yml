name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - run: uv sync --locked --extra dev --extra voice --extra images
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -vv -o faulthandler_timeout=30
        timeout-minutes: 2
      - run: uv run --no-sync commbadge voice --help
      - run: uv run --no-sync commbadge browse --help
      - run: uv run --no-sync commbadge call --help
      - run: uv run --no-sync commbadge phone-relay --help
