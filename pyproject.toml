[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "htn-commbadge"
version = "0.1.0"
description = "Python foundation for the Hack the North wearable AI comm badge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
voice = ["websockets>=15.0.1,<16"]

[project.scripts]
commbadge = "commbadge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
